<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Owner Feedback</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<style>
body{
  margin:0;
  padding:20px;
  font-family:Arial,sans-serif;
  background:#f4f6f8;
}

.container{
  max-width:700px;
  margin:auto;
}

h1{
  margin-bottom:5px;
}

#status{
  margin:15px 0;
}

.feedback{
  background:white;
  padding:16px;
  margin:12px 0;
  border-radius:14px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.message{
  font-size:16px;
  line-height:1.5;
  margin-bottom:10px;
}

.date{
  font-size:12px;
  color:#777;
}
</style>
</head>

<body>

<div class="container">

<h1>📩 Feedback</h1>

<p>Private feedback from Ethiopian Exam Prep users.</p>

<div id="status">Loading...</div>

<div id="feedbackList"></div>

</div>

<script>

const SUPABASE_URL =
"https://cvdrfzcyolijthcalnvc.supabase.co";

/*
  Use the same anon key already used
  in your main website config.js.
*/
const SUPABASE_ANON_KEY =
window.SUPABASE_ANON_KEY || "";

const OWNER_ID =
"bd2a31bd-9db2-41a8-b108-fc035de8b752";

const sb =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

async function loadFeedback(){

  const status =
    document.getElementById("status");

  const list =
    document.getElementById("feedbackList");

  try{

    const {
      data:{user},
      error:userError
    } = await sb.auth.getUser();

    if(userError || !user){

      status.textContent =
        "Please login first.";

      return;
    }

    if(user.id !== OWNER_ID){

      status.textContent =
        "🔒 Owner access only.";

      return;
    }

    const {data,error} =
      await sb
      .from("feedback")
      .select("id,message,created_at")
      .order("created_at",{ascending:false});

    if(error){

      console.error(error);

      status.textContent =
        "Failed to load feedback.";

      return;
    }

    status.textContent =
      data.length
      ? data.length + " feedback message(s)"
      : "No feedback yet.";

    list.innerHTML = "";

    data.forEach(item => {

      const div =
        document.createElement("div");

      div.className = "feedback";

      div.innerHTML = `
        <div class="message"></div>
        <div class="date">
          ${new Date(item.created_at).toLocaleString()}
        </div>
      `;

      div.querySelector(".message")
        .textContent = item.message;

      list.appendChild(div);

    });

  }catch(err){

    console.error(err);

    status.textContent =
      "Something went wrong.";

  }

}

loadFeedback();

</script>

</body>
</html>
