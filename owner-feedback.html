<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Owner Feedback</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<style>
body{
  margin:0;
  padding:20px;
  font-family:Arial,sans-serif;
  background:#f4f6f8;
}

.container{
  max-width:700px;
  margin:auto;
}

h1{
  margin-bottom:5px;
}

#status{
  margin:15px 0;
}

.feedback{
  background:white;
  padding:16px;
  margin:12px 0;
  border-radius:14px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.message{
  font-size:16px;
  line-height:1.5;
  margin-bottom:10px;
}

.date{
  font-size:12px;
  color:#777;
}
</style>
</head>

<body>

<div class="container">

<h1>📩 Feedback</h1>

<p>Private feedback from Ethiopian Exam Prep users.</p>

<div id="status">Loading...</div>
<div id="ownerLogin">

  <input
    id="ownerEmail"
    type="email"
    placeholder="Owner email"
    style="width:100%;padding:12px;margin:8px 0;box-sizing:border-box;"
  >

  <input
    id="ownerPassword"
    type="password"
    placeholder="Password"
    style="width:100%;padding:12px;margin:8px 0;box-sizing:border-box;"
  >

  <button
    onclick="ownerLogin()"
    style="padding:12px 20px;cursor:pointer;"
  >
    🔐 Login
  </button>

  <div id="loginMsg"></div>

</div>

<div id="feedbackList"></div>

</div>

<script>

const SUPABASE_URL =
"https://cvdrfzcyolijthcalnvc.supabase.co";

/*
  Use the same anon key already used
  in your main website config.js.
*/
const SUPABASE_ANON_KEY =
"sb_publishable_mRKBC_lMB1P3dlb0QBsZJA_D6N71mho";
const OWNER_ID =
"bd2a31bd-9db2-41a8-b108-fc035de8b752";

const sb =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);
async function ownerLogin(){

  const email =
    document.getElementById("ownerEmail").value.trim();

  const password =
    document.getElementById("ownerPassword").value;

  const msg =
    document.getElementById("loginMsg");

  if(!email || !password){

    msg.textContent =
      "Please enter email and password.";

    return;
  }

  const {data,error} =
    await sb.auth.signInWithPassword({
      email: email,
      password: password
    });

  if(error){

    msg.textContent =
      "Login error: " + error.message;

    return;
  }

  if(data.user.id !== OWNER_ID){

    await sb.auth.signOut();

    msg.textContent =
      "🔒 Owner access only.";

    return;
  }

  document.getElementById("ownerLogin").style.display =
    "none";

  msg.textContent = "";

  loadFeedback();
}

async function loadFeedback(){

  const status =
    document.getElementById("status");

  const list =
    document.getElementById("feedbackList");

  try {

    const { data: { session } } =
      await sb.auth.getSession();

    const user = session?.user;

    if (!user) {
      status.textContent =
        "Please login first.";
      return;
    }

    if (user.id !== OWNER_ID) {
      status.textContent =
        "🔒 Owner access only.";
      return;
    }

    const { data, error } =
      await sb
        .from("feedback")
.select("id,message,created_at,user_id,voice_path")
        .order("created_at", { ascending: false });

    if (error) {
      console.error(error);
      status.textContent =
        "Failed to load feedback: " +
        error.message;
      return;
    }

    status.textContent =
      data.length
        ? data.length + " feedback message(s)"
        : "No feedback yet.";

    list.innerHTML = "";

    for (const item of data) {

      const div =
        document.createElement("div");

      div.className = "feedback";

      let name = "Unknown user";

      const { data: profile } =
        await sb
          .from("profiles")
          .select("full_name")
          .eq("id", item.user_id)
          .maybeSingle();

      if (profile?.full_name) {
        name = profile.full_name;
      }

let voiceHTML = "";

if (item.voice_path) {

  const { data: urlData, error: urlError } =
    await sb.storage
      .from("feedback-voice")
      .createSignedUrl(item.voice_path, 3600);

  if (!urlError && urlData?.signedUrl) {

    const voiceURL = urlData.signedUrl;

    voiceHTML = `
      <div style="margin-top:15px;">
        <strong>🎙️ Voice Feedback:</strong>

        <audio
          controls
          src="${voiceURL}"
          style="width:100%;margin-top:10px;">
        </audio>

        <div style="margin-top:10px;">
          <a
            href="${voiceURL}"
            download="feedback-voice.webm"
            style="
              display:inline-block;
              padding:10px 15px;
              background:#2563eb;
              color:white;
              text-decoration:none;
              border-radius:10px;
              font-weight:bold;
            ">
            ⬇️ Download Voice
          </a>
        </div>
      </div>
    `;

  }
}

div.innerHTML = `
  <div>
    <strong>👤 Name:</strong>
    ${name}
  </div>

  <div>
    <strong>💬 Message:</strong>
    ${item.message || ""}
  </div>

  <div>
    <strong>🕐 Date:</strong>
    ${new Date(item.created_at).toLocaleString()}
  </div>

  ${voiceHTML}
`;
      list.appendChild(div);
    }

  } catch (err) {

    console.error(err);

    status.textContent =
      "Something went wrong: " +
      err.message;
  }
}

document.getElementById("status").textContent =
  "Please login as owner to view feedback.";
</script>
</body>
</html>
